name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read

env:
  QUALITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
  QUALITY_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Install Chromium for Browser Mode
        run: npx playwright install --with-deps --only-shell chromium

      - name: Shared typecheck
        run: npm run shared:typecheck

      - name: Server typecheck and lint
        run: npm run server:typecheck && npm run server:lint

      - name: Telemetry worker typecheck and dry run
        run: npm run telemetry:typecheck && npm run telemetry:dry-run

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Quality evidence
        run: |
          npm run quality:verify -- --base "$QUALITY_BASE"
          npm run quality:check -- --base "$QUALITY_BASE" --head "$QUALITY_HEAD"

      - name: Retain quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quality-${{ env.QUALITY_HEAD }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .fallow/quality
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Build
        run: npm run build

  server-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIXEL_FORGE_IMAGE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      PIXEL_FORGE_SMOKE_PROJECT_NAME: pixel-forge-container-smoke-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Build and smoke the linux/amd64 server image
        run: npm run server:container:smoke
